<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crops</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success"><div class="container"><a class="navbar-brand" href="index.html">AgriSys</a><div class="navbar-nav"><a class="nav-link" href="farmers.html">Farmers</a><a class="nav-link" href="farms.html">Farms</a><a class="nav-link" href="crops.html">Crops</a><a class="nav-link" href="plantings.html">Plantings</a><a class="nav-link" href="harvests.html">Harvests</a></div></div></nav>
<div class="container mt-4">
<h2>Crops</h2>
<form id="form" class="row g-2 mb-3">
<input class="form-control" id="name" placeholder="Crop name" required>
<input class="form-control" id="category" placeholder="Category" required>
<button class="btn btn-success" type="submit">Add</button>
</form>
<table class="table table-striped"><thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Actions</th></tr></thead><tbody id="tbody"></tbody></table>
</div>
<script src="app.js"></script>
<script>
const KEY='crops';
function render(){ document.getElementById('tbody').innerHTML=getAll(KEY).map(r=>`<tr><td>${r.id}</td><td>${r.name}</td><td>${r.category}</td><td><button class="btn btn-sm btn-danger" onclick="del(${r.id})">Delete</button></td></tr>`).join(''); }
document.getElementById('form').onsubmit=e=>{e.preventDefault(); add(KEY,{name:name.value,category:category.value}); render(); e.target.reset();};
function del(id){ if(confirm('Delete?')){ remove(KEY,id); render(); } }
render();
</script></body></html>
