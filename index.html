<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agriculture Information System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
  <div class="container">
    <a class="navbar-brand" href="index.html">AgriSys</a>
    <div class="navbar-nav">
      <a class="nav-link" href="farmers.html">Farmers</a>
      <a class="nav-link" href="farms.html">Farms</a>
      <a class="nav-link" href="crops.html">Crops</a>
      <a class="nav-link" href="plantings.html">Plantings</a>
      <a class="nav-link" href="harvests.html">Harvests</a>
    </div>
  </div>
</nav>
<div class="container mt-4">
  <h2>Dashboard</h2>
  <div class="row g-3 mt-2" id="cards"></div>
  <h4 class="mt-4">Recent Plantings</h4>
  <table class="table table-striped"><thead><tr><th>ID</th><th>Farm</th><th>Crop</th><th>Status</th></tr></thead><tbody id="recentPlantings"></tbody></table>
</div>
<script src="app.js"></script>
<script>
function loadDashboard(){
  const cards = [
    ['Farmers', count('farmers')],
    ['Farms', count('farms')],
    ['Crops', count('crops')],
    ['Plantings', count('plantings')],
    ['Harvests', count('harvests')]
  ];
  document.getElementById('cards').innerHTML = cards.map(([n,v])=>`<div class="col-md-2"><div class="card text-center"><div class="card-body"><h6>${n}</h6><h3>${v}</h3></div></div></div>`).join('');
  const plantings = getAll('plantings').slice(-5).reverse();
  document.getElementById('recentPlantings').innerHTML = plantings.map(p=>`<tr><td>${p.id}</td><td>${p.farm}</td><td>${p.crop}</td><td>${p.status}</td></tr>`).join('');
}
loadDashboard();
</script>
</body>
</html>
